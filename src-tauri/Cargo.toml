[package]
name = "cc-assist"
version = "2.0.0"
description = "CC Assistant"
authors = ["karoyqiu@gmail.com"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cc_assist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
log = "0.4"
simplelog = "0.12"
tempfile = "3"
portable-pty = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "rt"] }
futures = "0.3"
time = { version = "0.3", features = ["formatting", "serde", "serde-human-readable"] }
uuid = { version = "1", features = ["v4"] }
cc-sdk = "0.8.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-system-fonts = "2.0.2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
